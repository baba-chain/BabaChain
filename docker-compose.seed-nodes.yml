networks:
  babachain-network:
    driver: bridge
services:
  babachain-node1:
    container_name: babachain-node1
    environment:
      BABACHAIN_NETWORK: mainnet
      BABACHAIN_NODE_TYPE: seed
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - babachain-cli
      - getnetworkinfo
      timeout: 10s
    image: babachain/babachain:latest
    networks:
    - babachain-network
    ports:
    - 9999:9999
    - 9998:9998
    restart: unless-stopped
    volumes:
    - node1-data:/home/babachain/.babachain
    - ./config/seed-nodes/node1.conf:/home/babachain/.babachain/babachain.conf:ro
  babachain-node2:
    container_name: babachain-node2
