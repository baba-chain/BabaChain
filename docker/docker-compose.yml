version: '3.8'

services:
  babachain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: babachain-node
    restart: unless-stopped
    ports:
      - "9999:9999"  # P2P port
      - "9998:9998"  # RPC port
    volumes:
      - babachain-data:/home/babachain/.babachain
      - ./logs:/home/babachain/logs
    environment:
      - RPC_USER=babachain_user
      - RPC_PASSWORD=GÜÇLÜ_ŞİFRE_BURAYA_YAZIN
      - STAKING=1
      - STAKEGEN=1
      - MAX_CONNECTIONS=125
      - DB_CACHE=300
      - DEBUG=pos,staking,net
    healthcheck:
      test: ["CMD", "babachain-cli", "getblockcount"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - babachain-network

  # Opsiyonel: Monitoring için Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: babachain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - babachain-network
    profiles:
      - monitoring

  # Opsiyonel: Görselleştirme için Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: babachain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - babachain-network
    profiles:
      - monitoring

volumes:
  babachain-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  babachain-network:
    driver: bridge