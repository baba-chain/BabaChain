apiVersion: v1
data:
  babachain.conf: '# BabaChain Seed Node Configuration - node1

    # Location: US-West

    # Hostname: node1.babachain.network

    # Generated: 2025-11-05T18:04:23.892331


    # Network settings

    rpcuser=babachain_seed_node1

    rpcpassword=CHANGE_THIS_SECURE_PASSWORD_NODE1

    rpcport=9998

    port=9999

    rpcbind=0.0.0.0

    rpcallowip=0.0.0.0/0


    # Seed node specific settings

    listen=1

    discover=1

    upnp=0

    maxconnections=200

    timeout=5000


    # PoS settings (seed nodes should stake)

    staking=1

    stakegen=1

    reservebalance=1000


    # Performance settings for seed nodes

    dbcache=512

    maxmempool=500

    mempoolexpiry=72


    # Connect to other seed nodes

    addnode=seed1.babachain.org:9999

    addnode=seed2.babachain.org:9999

    addnode=seed3.babachain.org:9999

    addnode=node2.babachain.network:9999


    # Logging for seed nodes

    debug=net

    debug=addrman

    debug=pos

    debug=staking


    # Security settings

    rpcssl=0

    rpcsslcertificatechainfile=server.cert

    rpcsslprivatekeyfile=server.pem


    # Mainnet settings

    testnet=0

    regtest=0


    # Seed node identification

    uacomment=BabaChain-Seed-node1-US-West

    '
kind: ConfigMap
metadata:
  name: babachain-node1-config
  namespace: babachain
