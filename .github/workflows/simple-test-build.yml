name: 🧪 Simple Test Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to test'
        type: choice
        options:
          - 'ubuntu-latest'
          - 'macos-latest'
          - 'windows-latest'
        default: 'ubuntu-latest'

jobs:
  simple-build-test:
    name: 🧪 Simple Build Test
    runs-on: ${{ github.event.inputs.platform }}
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 System Information
        run: |
          echo "🖥️ System Information:"
          echo "OS: ${{ runner.os }}"
          echo "Architecture: $(uname -m)"
          
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "Distribution: $(lsb_release -d 2>/dev/null || echo 'Unknown')"
            echo "Kernel: $(uname -r)"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "macOS Version: $(sw_vers -productVersion)"
            echo "Hardware: $(uname -m)"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "Windows Version: $(systeminfo | findstr /B /C:"OS Name" /C:"OS Version")"
          fi
        shell: bash

      - name: 🔧 Check Build Tools
        run: |
          echo "🔧 Checking available build tools:"
          
          # Check CMake
          if command -v cmake &> /dev/null; then
            echo "✅ CMake: $(cmake --version | head -n1)"
          else
            echo "❌ CMake: Not found"
          fi
          
          # Check compilers
          if [ "${{ runner.os }}" = "Linux" ]; then
            if command -v gcc &> /dev/null; then
              echo "✅ GCC: $(gcc --version | head -n1)"
            else
              echo "❌ GCC: Not found"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            if command -v clang &> /dev/null; then
              echo "✅ Clang: $(clang --version | head -n1)"
            else
              echo "❌ Clang: Not found"
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if command -v cl &> /dev/null; then
              echo "✅ MSVC: Available"
            else
              echo "❌ MSVC: Not in PATH (will be configured later)"
            fi
          fi
          
          # Check Git
          if command -v git &> /dev/null; then
            echo "✅ Git: $(git --version)"
          else
            echo "❌ Git: Not found"
          fi
        shell: bash

      - name: 📦 Check BabaChain Source
        run: |
          echo "📦 BabaChain source code check:"
          echo "Repository: $(pwd)"
          echo "Branch: $(git branch --show-current)"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Files in src/:"
          ls -la src/ | head -10
          
          # Check for key files
          if [ -f "CMakeLists.txt" ]; then
            echo "✅ CMakeLists.txt found"
          else
            echo "❌ CMakeLists.txt not found"
          fi
          
          if [ -f "configure.ac" ]; then
            echo "✅ configure.ac found"
          else
            echo "❌ configure.ac not found"
          fi
          
          if [ -f "src/babachaind.cpp" ]; then
            echo "✅ babachaind.cpp found"
          else
            echo "❌ babachaind.cpp not found"
          fi
        shell: bash

      - name: 🧪 Quick Compilation Test
        run: |
          echo "🧪 Attempting quick compilation test..."
          
          # Create a simple test to verify basic compilation works
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "Testing Linux compilation environment..."
            echo '#include <iostream>' > test.cpp
            echo 'int main() { std::cout << "Hello BabaChain!" << std::endl; return 0; }' >> test.cpp
            
            if command -v g++ &> /dev/null; then
              g++ -o test test.cpp && ./test && echo "✅ Basic compilation works"
            else
              echo "⚠️ g++ not available, will install in full build"
            fi
            
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "Testing macOS compilation environment..."
            echo '#include <iostream>' > test.cpp
            echo 'int main() { std::cout << "Hello BabaChain!" << std::endl; return 0; }' >> test.cpp
            
            if command -v clang++ &> /dev/null; then
              clang++ -o test test.cpp && ./test && echo "✅ Basic compilation works"
            else
              echo "⚠️ clang++ not available"
            fi
            
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "Testing Windows compilation environment..."
            echo "Windows compilation will be tested in full build workflow"
          fi
        shell: bash

      - name: 📊 Test Summary
        run: |
          echo "📊 Test Summary for ${{ runner.os }}:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Operating System | ✅ ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Repository | ✅ Available |" >> $GITHUB_STEP_SUMMARY
          echo "| Source Code | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Environment | 🧪 Tested |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Ready for full cross-platform build!**" >> $GITHUB_STEP_SUMMARY
        shell: bash