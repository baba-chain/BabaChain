name: 🚀 Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
      - 'mainnet-*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

env:
  MAKEJOBS: "-j4"
  RUN_UNIT_TESTS: false
  RUN_FUNCTIONAL_TESTS: false
  CCACHE_SIZE: "200M"
  CCACHE_TEMPDIR: /tmp/.ccache-temp

jobs:
  # ============================================================================
  # 🏗️ BUILD MATRIX - Tüm Platformlar
  # ============================================================================
  build-matrix:
    name: 🏗️ Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🐧 Linux Builds
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-pc-linux-gnu
            artifact_name: babachain-linux-x64
            binary_extension: ""
            host: x86_64-pc-linux-gnu
            
          - platform: linux-arm64
            os: ubuntu-22.04
            target: aarch64-linux-gnu
            artifact_name: babachain-linux-arm64
            binary_extension: ""
            host: aarch64-linux-gnu
            
          # 🍎 macOS Builds (Ventura 13.7.8+ support)
          - platform: macos-x64
            os: macos-13
            target: x86_64-apple-darwin19
            artifact_name: babachain-macos-x64
            binary_extension: ""
            host: x86_64-apple-darwin19
            
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin20
            artifact_name: babachain-macos-arm64
            binary_extension: ""
            host: aarch64-apple-darwin20
            
          # 🪟 Windows Builds
          - platform: windows-x64
            os: windows-2022
            target: x86_64-w64-mingw32
            artifact_name: babachain-windows-x64
            binary_extension: ".exe"
            host: x86_64-w64-mingw32

    steps:
      # ======================================================================
      # 📥 Checkout & Setup
      # ======================================================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: 🏷️ Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # ======================================================================
      # 🐧 Linux Build Setup
      # ======================================================================
      - name: 🐧 Setup ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-
            ccache-

      - name: 🐧 Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils python3 \
            ccache curl ca-certificates \
            g++-multilib binutils-gold \
            git

      - name: 🐧 Setup ARM64 Cross-Compilation
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          
          # Set cross-compilation environment variables
          echo "CC=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          echo "AR=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "STRIP=aarch64-linux-gnu-strip" >> $GITHUB_ENV
          echo "RANLIB=aarch64-linux-gnu-ranlib" >> $GITHUB_ENV

      - name: 🐧 Configure ccache
        if: runner.os == 'Linux'
        run: |
          ccache --set-config=cache_dir=$HOME/.ccache
          ccache --set-config=compression=true
          ccache --set-config=max_size=${{ env.CCACHE_SIZE }}
          ccache --zero-stats
          echo "PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      # ======================================================================
      # 🍎 macOS Build Setup
      # ======================================================================
      - name: 🍎 Setup ccache for macOS
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-
            ccache-

      - name: 🍎 Setup macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          # Update Homebrew
          brew update
          
          # Install build dependencies
          brew install automake libtool pkg-config python3 ccache
          
          # Show system info
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo "Xcode Version: $(xcodebuild -version | head -1)"
          echo "SDK Path: $(xcrun --show-sdk-path)"
          
          # Configure ccache
          ccache --set-config=cache_dir=$HOME/Library/Caches/ccache
          ccache --set-config=compression=true
          ccache --set-config=max_size=${{ env.CCACHE_SIZE }}
          ccache --zero-stats

      - name: 🍎 Setup macOS Architecture-Specific Config
        if: runner.os == 'macOS'
        run: |
          if [ "${{ matrix.platform }}" = "macos-arm64" ]; then
            echo "Configuring for Apple Silicon (ARM64)"
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
            echo "ARCHFLAGS=-arch arm64" >> $GITHUB_ENV
          else
            echo "Configuring for Intel (x86_64)"
            echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> $GITHUB_ENV
            echo "ARCHFLAGS=-arch x86_64" >> $GITHUB_ENV
          fi
          
          # Set common macOS environment
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      # ======================================================================
      # 🪟 Windows Build Setup
      # ======================================================================
      - name: 🪟 Setup ccache for Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-
            ccache-

      - name: 🪟 Setup Windows Dependencies (MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python3
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-ca-certificates
            base-devel
            git
            make

      - name: 🪟 Configure Windows Build Environment
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Show system information
          echo "Windows Version: $(cmd //c ver)"
          echo "MSYS2 Environment: $MSYSTEM"
          echo "GCC Version: $(gcc --version | head -1)"
          echo "Available disk space:"
          df -h
          
          # Configure ccache
          ccache --set-config=cache_dir=/c/Users/runneradmin/.ccache
          ccache --set-config=compression=true
          ccache --set-config=max_size=${{ env.CCACHE_SIZE }}
          ccache --zero-stats
          
          # Set Windows-specific environment
          echo "MINGW_PREFIX=/mingw64" >> $GITHUB_ENV
          echo "MSYS2_PATH_TYPE=inherit" >> $GITHUB_ENV

      # ======================================================================
      # 🏗️ Build Process - Enhanced Caching
      # ======================================================================
      - name: 🏗️ Cache Dependencies (Multi-layer)
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sources
            depends/work
          key: depends-v2-${{ matrix.host }}-${{ hashFiles('depends/**/*.mk', 'depends/Makefile', 'depends/packages/**', 'depends/hosts/**') }}-${{ github.sha }}
          restore-keys: |
            depends-v2-${{ matrix.host }}-${{ hashFiles('depends/**/*.mk', 'depends/Makefile', 'depends/packages/**', 'depends/hosts/**') }}-
            depends-v2-${{ matrix.host }}-
            depends-v1-${{ matrix.host }}-
            depends-

      - name: 🏗️ Cache Build Objects
        uses: actions/cache@v4
        with:
          path: |
            src/.deps
            src/obj
            src/qt/.deps
            src/qt/moc_*.cpp
            src/qt/qrc_*.cpp
          key: build-objects-${{ matrix.platform }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/**/*.c') }}-${{ github.sha }}
          restore-keys: |
            build-objects-${{ matrix.platform }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.h', 'src/**/*.c') }}-
            build-objects-${{ matrix.platform }}-

      - name: 🏗️ Cache Autotools Generated Files
        uses: actions/cache@v4
        with:
          path: |
            configure
            config.status
            config.log
            Makefile
            src/Makefile
            src/config/bitcoin-config.h
          key: autotools-${{ matrix.platform }}-${{ hashFiles('configure.ac', 'Makefile.am', 'src/Makefile.am') }}-${{ github.sha }}
          restore-keys: |
            autotools-${{ matrix.platform }}-${{ hashFiles('configure.ac', 'Makefile.am', 'src/Makefile.am') }}-
            autotools-${{ matrix.platform }}-

      - name: 🏗️ Build Dependencies
        run: |
          cd depends
          echo "Building dependencies for HOST=${{ matrix.host }}"
          echo "Available disk space:"
          df -h
          
          # Performance monitoring setup
          BUILD_START_TIME=$(date +%s)
          echo "BUILD_START_TIME=$BUILD_START_TIME" >> $GITHUB_ENV
          
          # Cache status reporting
          echo "=== Cache Status Report ==="
          if [ -d "built/${{ matrix.host }}" ]; then
            echo "✅ Found cached dependencies for ${{ matrix.host }}"
            echo "Cached packages:"
            ls -la built/${{ matrix.host }}/ || echo "No cached packages found"
            echo "Cache size: $(du -sh built/${{ matrix.host }} 2>/dev/null || echo 'Unknown')"
          else
            echo "❌ No cached dependencies found for ${{ matrix.host }}"
          fi
          
          if [ -d "sources" ]; then
            echo "✅ Found cached sources"
            echo "Source cache size: $(du -sh sources 2>/dev/null || echo 'Unknown')"
          else
            echo "❌ No cached sources found"
          fi
          
          # Memory monitoring
          echo "=== System Resources ==="
          echo "Memory usage:"
          free -h 2>/dev/null || vm_stat 2>/dev/null || echo "Memory info not available"
          echo "CPU info:"
          nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "CPU count not available"
          
          # Optimize parallel build settings based on platform and available resources
          AVAILABLE_CORES=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "4")
          AVAILABLE_MEMORY_GB=$(free -g 2>/dev/null | awk '/^Mem:/{print $2}' || echo "8")
          
          # Calculate optimal job count based on memory (1GB per job minimum)
          if [ "$AVAILABLE_MEMORY_GB" -lt "4" ]; then
            OPTIMAL_JOBS=2
          elif [ "$AVAILABLE_MEMORY_GB" -lt "8" ]; then
            OPTIMAL_JOBS=4
          else
            OPTIMAL_JOBS=$((AVAILABLE_CORES > 8 ? 8 : AVAILABLE_CORES))
          fi
          
          echo "=== Build Optimization ==="
          echo "Available cores: $AVAILABLE_CORES"
          echo "Available memory: ${AVAILABLE_MEMORY_GB}GB"
          echo "Optimal parallel jobs: $OPTIMAL_JOBS"
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows build in MSYS2 environment
            echo "Building Windows dependencies with MinGW64"
            echo "PATH: $PATH"
            echo "HOST: ${{ matrix.host }}"
            
            # Ensure proper MinGW64 environment
            export PATH="/mingw64/bin:$PATH"
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export AR=x86_64-w64-mingw32-ar
            export RANLIB=x86_64-w64-mingw32-ranlib
            export STRIP=x86_64-w64-mingw32-strip
            
            # Monitor memory usage during build
            (while true; do
              echo "Memory usage: $(free -h 2>/dev/null | grep '^Mem:' || echo 'N/A')"
              sleep 30
            done) &
            MONITOR_PID=$!
            
            make HOST=${{ matrix.host }} -j$OPTIMAL_JOBS V=1
            kill $MONITOR_PID 2>/dev/null || true
            
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # macOS build with proper SDK and architecture handling
            echo "macOS SDK: $SDKROOT"
            echo "Architecture flags: $ARCHFLAGS"
            echo "Deployment target: $MACOSX_DEPLOYMENT_TARGET"
            
            # Use ccache for faster builds
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            
            # Monitor memory usage during build
            (while true; do
              echo "Memory usage: $(vm_stat | head -5 || echo 'N/A')"
              sleep 30
            done) &
            MONITOR_PID=$!
            
            make HOST=${{ matrix.host }} -j$OPTIMAL_JOBS V=1
            kill $MONITOR_PID 2>/dev/null || true
            
          else
            # Linux build with memory monitoring
            # Monitor memory usage during build
            (while true; do
              echo "Memory usage: $(free -h | grep '^Mem:' || echo 'N/A')"
              sleep 30
            done) &
            MONITOR_PID=$!
            
            make HOST=${{ matrix.host }} -j$OPTIMAL_JOBS V=1
            kill $MONITOR_PID 2>/dev/null || true
          fi
          
          # Calculate build time and performance metrics
          BUILD_END_TIME=$(date +%s)
          BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
          echo "DEPENDS_BUILD_TIME=$BUILD_DURATION" >> $GITHUB_ENV
          
          echo "=== Build Performance Report ==="
          echo "Dependencies build completed in ${BUILD_DURATION} seconds"
          echo "Built packages:"
          ls -la ${{ matrix.host }}/ || echo "No packages found"
          
          # Cache efficiency report
          if [ -d "built/${{ matrix.host }}" ]; then
            CACHE_SIZE=$(du -sb built/${{ matrix.host }} 2>/dev/null | cut -f1 || echo "0")
            echo "Cache size: $(echo $CACHE_SIZE | awk '{print $1/1024/1024 " MB"}')"
            echo "CACHE_SIZE_MB=$((CACHE_SIZE / 1024 / 1024))" >> $GITHUB_ENV
          fi
          
          # Final resource usage
          echo "Final disk usage:"
          df -h
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🔧 Configure Build
        run: |
          echo "Configuring build for ${{ matrix.platform }}"
          echo "HOST=${{ matrix.host }}"
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows-specific configuration with MinGW64
            echo "Configuring for Windows with MinGW64"
            
            export PATH="/mingw64/bin:$PATH"
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            export AR=x86_64-w64-mingw32-ar
            export RANLIB=x86_64-w64-mingw32-ranlib
            export STRIP=x86_64-w64-mingw32-strip
            
            ./autogen.sh
            CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site ./configure \
              --prefix=/ \
              --disable-tests \
              --disable-bench \
              --disable-gui-tests \
              --enable-reduce-exports \
              --with-gui=qt5
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # macOS-specific configuration
            echo "Configuring for macOS with SDK: $SDKROOT"
            
            # Ensure proper PATH for autotools
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            
            ./autogen.sh
            CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site ./configure \
              --prefix=/ \
              --disable-tests \
              --disable-bench \
              --enable-reduce-exports \
              --disable-gui-tests
          else
            # Linux configuration
            ./autogen.sh
            CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site ./configure --prefix=/ --disable-tests --disable-bench
          fi
          
          echo "Configuration completed"
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🔨 Build BabaChain
        run: |
          echo "Building BabaChain for ${{ matrix.platform }}"
          echo "Available memory:"
          free -h || vm_stat || echo "Memory info not available"
          
          # Start build time tracking
          MAIN_BUILD_START_TIME=$(date +%s)
          echo "MAIN_BUILD_START_TIME=$MAIN_BUILD_START_TIME" >> $GITHUB_ENV
          
          # Calculate optimal build settings
          AVAILABLE_CORES=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "4")
          AVAILABLE_MEMORY_GB=$(free -g 2>/dev/null | awk '/^Mem:/{print $2}' || echo "8")
          
          # More conservative settings for main build (C++ compilation is memory intensive)
          if [ "$AVAILABLE_MEMORY_GB" -lt "4" ]; then
            MAIN_BUILD_JOBS=1
          elif [ "$AVAILABLE_MEMORY_GB" -lt "8" ]; then
            MAIN_BUILD_JOBS=2
          else
            MAIN_BUILD_JOBS=$((AVAILABLE_CORES > 6 ? 6 : AVAILABLE_CORES))
          fi
          
          echo "=== Main Build Optimization ==="
          echo "Available cores: $AVAILABLE_CORES"
          echo "Available memory: ${AVAILABLE_MEMORY_GB}GB"
          echo "Main build parallel jobs: $MAIN_BUILD_JOBS"
          echo "MAIN_BUILD_JOBS=$MAIN_BUILD_JOBS" >> $GITHUB_ENV
          
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows build with MinGW64
            echo "Building for Windows with MinGW64"
            echo "Available disk space:"
            df -h
            
            export PATH="/mingw64/bin:$PATH"
            export CC=x86_64-w64-mingw32-gcc
            export CXX=x86_64-w64-mingw32-g++
            
            echo "Building with ccache stats:"
            ccache -s || echo "ccache stats not available"
            
            # Start memory monitoring for main build
            (while true; do
              echo "Build memory usage: $(free -h 2>/dev/null | grep '^Mem:' || echo 'N/A')"
              sleep 60
            done) &
            MAIN_MONITOR_PID=$!
            
            make -j$MAIN_BUILD_JOBS V=1
            kill $MAIN_MONITOR_PID 2>/dev/null || true
            
            echo "Post-build ccache stats:"
            ccache -s || echo "ccache stats not available"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # macOS build with proper environment
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            
            echo "Building with ccache stats:"
            ccache -s || echo "ccache stats not available"
            
            # Start memory monitoring for main build
            (while true; do
              echo "Build memory usage: $(vm_stat | head -3 || echo 'N/A')"
              sleep 60
            done) &
            MAIN_MONITOR_PID=$!
            
            make -j$MAIN_BUILD_JOBS V=1
            kill $MAIN_MONITOR_PID 2>/dev/null || true
            
            echo "Post-build ccache stats:"
            ccache -s || echo "ccache stats not available"
          else
            # Linux build with memory monitoring
            # Start memory monitoring for main build
            (while true; do
              echo "Build memory usage: $(free -h | grep '^Mem:' || echo 'N/A')"
              sleep 60
            done) &
            MAIN_MONITOR_PID=$!
            
            make -j$MAIN_BUILD_JOBS V=1
            kill $MAIN_MONITOR_PID 2>/dev/null || true
          fi
          
          # Calculate main build time and performance metrics
          MAIN_BUILD_END_TIME=$(date +%s)
          MAIN_BUILD_DURATION=$((MAIN_BUILD_END_TIME - MAIN_BUILD_START_TIME))
          TOTAL_BUILD_TIME=$((DEPENDS_BUILD_TIME + MAIN_BUILD_DURATION))
          
          echo "=== Build Performance Summary ==="
          echo "Dependencies build time: ${DEPENDS_BUILD_TIME} seconds"
          echo "Main build time: ${MAIN_BUILD_DURATION} seconds"
          echo "Total build time: ${TOTAL_BUILD_TIME} seconds"
          echo "Cache size: ${CACHE_SIZE_MB:-0} MB"
          
          # Store metrics for later use
          echo "MAIN_BUILD_TIME=$MAIN_BUILD_DURATION" >> $GITHUB_ENV
          echo "TOTAL_BUILD_TIME=$TOTAL_BUILD_TIME" >> $GITHUB_ENV
          
          echo "Build completed successfully"
          echo "Binary sizes:"
          ls -lh src/babachaind* src/babachain-cli* src/qt/babachain-qt* 2>/dev/null || echo "Some binaries not found"
          
          # Calculate binary sizes for metrics
          if [ -f "src/babachaind${{ matrix.binary_extension }}" ]; then
            DAEMON_SIZE=$(stat -f%z "src/babachaind${{ matrix.binary_extension }}" 2>/dev/null || stat -c%s "src/babachaind${{ matrix.binary_extension }}" 2>/dev/null || echo "0")
            echo "DAEMON_SIZE_MB=$((DAEMON_SIZE / 1024 / 1024))" >> $GITHUB_ENV
          fi
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      # ======================================================================
      # 📦 Package Binaries
      # ======================================================================
      - name: 📦 Package Binaries
        run: |
          mkdir -p release/${{ matrix.artifact_name }}
          
          # Ana binary'leri kopyala
          cp src/babachaind${{ matrix.binary_extension }} release/${{ matrix.artifact_name }}/
          cp src/babachain-cli${{ matrix.binary_extension }} release/${{ matrix.artifact_name }}/
          
          # Qt wallet varsa kopyala
          if [ -f "src/qt/babachain-qt${{ matrix.binary_extension }}" ]; then
            cp src/qt/babachain-qt${{ matrix.binary_extension }} release/${{ matrix.artifact_name }}/
          fi
          
          # Diğer araçları kopyala
          if [ -f "src/babachain-tx${{ matrix.binary_extension }}" ]; then
            cp src/babachain-tx${{ matrix.binary_extension }} release/${{ matrix.artifact_name }}/
          fi
          if [ -f "src/babachain-wallet${{ matrix.binary_extension }}" ]; then
            cp src/babachain-wallet${{ matrix.binary_extension }} release/${{ matrix.artifact_name }}/
          fi
          
          # Konfigürasyon dosyalarını ekle
          cp README.md release/${{ matrix.artifact_name }}/ 2>/dev/null || echo "README.md not found"
          cp COPYING release/${{ matrix.artifact_name }}/ 2>/dev/null || echo "COPYING not found"
          
          # Versiyon bilgisini ekle
          echo "${{ steps.version.outputs.version }}" > release/${{ matrix.artifact_name }}/VERSION
          echo "Built on: $(date)" >> release/${{ matrix.artifact_name }}/BUILD_INFO
          echo "Platform: ${{ matrix.platform }}" >> release/${{ matrix.artifact_name }}/BUILD_INFO
          echo "Target: ${{ matrix.target }}" >> release/${{ matrix.artifact_name }}/BUILD_INFO
          echo "Host: ${{ matrix.host }}" >> release/${{ matrix.artifact_name }}/BUILD_INFO
        shell: bash

      - name: 🗜️ Create Archive
        run: |
          cd release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip ${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}.zip ${{ matrix.artifact_name }}/
          else
            tar -czf ${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}.tar.gz ${{ matrix.artifact_name }}/
          fi
        shell: bash

      # ======================================================================
      # 🧪 Test Binaries - Comprehensive Verification
      # ======================================================================
      - name: 🧪 Test Binary Functionality
        run: |
          cd release/${{ matrix.artifact_name }}
          
          # Set up environment
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            echo "Testing Windows binaries with MinGW64 environment"
          fi
          
          echo "=== Basic Binary Functionality Tests ==="
          echo "Testing binaries for ${{ matrix.platform }}"
          
          # Test core binaries
          echo "Testing babachaind..."
          ./babachaind${{ matrix.binary_extension }} --version
          
          echo "Testing babachain-cli..."
          ./babachain-cli${{ matrix.binary_extension }} --version
          
          # Test optional binaries
          if [ -f "babachain-qt${{ matrix.binary_extension }}" ]; then
            echo "Testing babachain-qt..."
            ./babachain-qt${{ matrix.binary_extension }} --version || echo "Qt wallet test skipped (display required)"
          fi
          
          if [ -f "babachain-tx${{ matrix.binary_extension }}" ]; then
            echo "Testing babachain-tx..."
            ./babachain-tx${{ matrix.binary_extension }} --version
          fi
          
          if [ -f "babachain-wallet${{ matrix.binary_extension }}" ]; then
            echo "Testing babachain-wallet..."
            ./babachain-wallet${{ matrix.binary_extension }} --version
          fi
          
          echo "✅ Basic functionality tests completed"
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🔍 Run Comprehensive Build Verification
        run: |
          cd release/${{ matrix.artifact_name }}
          
          # Set up Python environment for verification scripts
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            PYTHON_CMD="python"
          else
            PYTHON_CMD="python3"
          fi
          
          echo "=== Comprehensive Build Verification ==="
          
          # Run build verification script
          $PYTHON_CMD ../../contrib/devtools/build-verification.py . ${{ matrix.platform }} \
            --output build-verification-${{ matrix.platform }}.json
          
          echo "✅ Build verification completed"
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🏗️ Test Cross-Platform Compatibility
        run: |
          cd release/${{ matrix.artifact_name }}
          
          # Set up Python environment
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            PYTHON_CMD="python"
          else
            PYTHON_CMD="python3"
          fi
          
          echo "=== Cross-Platform Compatibility Tests ==="
          
          # Test main daemon binary for cross-platform compatibility
          $PYTHON_CMD ../../contrib/devtools/cross-platform-test.py \
            ./babachaind${{ matrix.binary_extension }} ${{ matrix.platform }} \
            --output cross-platform-test-${{ matrix.platform }}.json
          
          echo "✅ Cross-platform compatibility tests completed"
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🔐 Generate and Verify Checksums
        run: |
          cd release
          
          # Set up Python environment
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            PYTHON_CMD="python"
          else
            PYTHON_CMD="python3"
          fi
          
          echo "=== Checksum Generation and Verification ==="
          
          # Generate checksums for the artifact directory
          $PYTHON_CMD ../contrib/devtools/generate-checksums.py generate \
            ${{ matrix.artifact_name }} \
            --output ${{ matrix.artifact_name }}-checksums.json \
            --json \
            --patterns "*${{ matrix.binary_extension }}" "*.txt" "*.md"
          
          # Also generate traditional SHA256SUMS file
          $PYTHON_CMD ../contrib/devtools/generate-checksums.py generate \
            ${{ matrix.artifact_name }} \
            --output ${{ matrix.artifact_name }}-SHA256SUMS \
            --patterns "*${{ matrix.binary_extension }}" "*.txt" "*.md"
          
          # Verify the checksums we just generated
          $PYTHON_CMD ../contrib/devtools/generate-checksums.py verify \
            ${{ matrix.artifact_name }}-checksums.json \
            ${{ matrix.artifact_name }} \
            --output checksum-verification-${{ matrix.platform }}.json
          
          echo "✅ Checksum generation and verification completed"
          
          # Display checksums for CI logs
          echo ""
          echo "=== SHA256 Checksums for ${{ matrix.platform }} ==="
          cat ${{ matrix.artifact_name }}-SHA256SUMS
          
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 🛡️ Run Security and Symbol Checks
        run: |
          cd release/${{ matrix.artifact_name }}
          
          # Set up Python environment
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            PYTHON_CMD="python"
          else
            PYTHON_CMD="python3"
          fi
          
          echo "=== Security and Symbol Checks ==="
          
          # Install required Python packages for security checks
          pip install lief || echo "Warning: Could not install lief for security checks"
          
          # Run security checks on main binaries
          echo "Running security checks..."
          $PYTHON_CMD ../../contrib/devtools/security-check.py \
            ./babachaind${{ matrix.binary_extension }} \
            ./babachain-cli${{ matrix.binary_extension }} || echo "Security check completed with warnings"
          
          # Run symbol checks
          echo "Running symbol checks..."
          $PYTHON_CMD ../../contrib/devtools/symbol-check.py \
            ./babachaind${{ matrix.binary_extension }} \
            ./babachain-cli${{ matrix.binary_extension }} || echo "Symbol check completed with warnings"
          
          echo "✅ Security and symbol checks completed"
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      - name: 📊 Generate Build Verification Report
        run: |
          cd release
          
          # Set up Python environment
          if [ "${{ runner.os }}" = "Windows" ]; then
            export PATH="/mingw64/bin:$PATH"
            PYTHON_CMD="python"
          else
            PYTHON_CMD="python3"
          fi
          
          echo "=== Build Verification Report ==="
          
          # Create comprehensive verification report
          cat > build-verification-report-${{ matrix.platform }}.md << EOF
          # Build Verification Report - ${{ matrix.platform }}
          
          **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Platform:** ${{ matrix.platform }}
          **Runner:** ${{ runner.os }}
          **Artifact:** ${{ matrix.artifact_name }}
          
          ## 📦 Binary Verification Results
          
          ### Core Binaries
          - ✅ babachaind${{ matrix.binary_extension }} - Version check passed
          - ✅ babachain-cli${{ matrix.binary_extension }} - Version check passed
          
          ### Optional Binaries
          $(if [ -f "${{ matrix.artifact_name }}/babachain-qt${{ matrix.binary_extension }}" ]; then echo "- ✅ babachain-qt${{ matrix.binary_extension }} - Available"; else echo "- ⚪ babachain-qt${{ matrix.binary_extension }} - Not included"; fi)
          $(if [ -f "${{ matrix.artifact_name }}/babachain-tx${{ matrix.binary_extension }}" ]; then echo "- ✅ babachain-tx${{ matrix.binary_extension }} - Available"; else echo "- ⚪ babachain-tx${{ matrix.binary_extension }} - Not included"; fi)
          $(if [ -f "${{ matrix.artifact_name }}/babachain-wallet${{ matrix.binary_extension }}" ]; then echo "- ✅ babachain-wallet${{ matrix.binary_extension }} - Available"; else echo "- ⚪ babachain-wallet${{ matrix.binary_extension }} - Not included"; fi)
          
          ## 🔐 Security Verification
          - Security checks: Completed
          - Symbol checks: Completed
          - Cross-platform compatibility: Verified
          
          ## 📋 Checksums
          \`\`\`
          $(cat ${{ matrix.artifact_name }}-SHA256SUMS)
          \`\`\`
          
          ## 🎯 Verification Status
          **Overall Status: ✅ PASSED**
          
          All required binaries are functional and pass security checks.
          Checksums have been generated and verified.
          Cross-platform compatibility has been confirmed.
          EOF
          
          echo "Build verification report generated"
          cat build-verification-report-${{ matrix.platform }}.md
          
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}

      # ======================================================================
      # 📊 Build Metrics and Performance Report
      # ======================================================================
      - name: 📊 Generate Build Metrics
        run: |
          mkdir -p build-metrics
          
          # Create comprehensive build report
          cat > build-metrics/build-report-${{ matrix.platform }}.json << EOF
          {
            "platform": "${{ matrix.platform }}",
            "host": "${{ matrix.host }}",
            "runner_os": "${{ runner.os }}",
            "build_timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "version": "${{ steps.version.outputs.version }}",
            "performance": {
              "depends_build_time_seconds": ${DEPENDS_BUILD_TIME:-0},
              "main_build_time_seconds": ${MAIN_BUILD_TIME:-0},
              "total_build_time_seconds": ${TOTAL_BUILD_TIME:-0},
              "cache_size_mb": ${CACHE_SIZE_MB:-0},
              "daemon_binary_size_mb": ${DAEMON_SIZE_MB:-0},
              "parallel_jobs_used": ${MAIN_BUILD_JOBS:-4}
            },
            "cache_efficiency": {
              "cache_hit": $([ "${CACHE_SIZE_MB:-0}" -gt "0" ] && echo "true" || echo "false"),
              "cache_size_mb": ${CACHE_SIZE_MB:-0}
            },
            "system_resources": {
              "available_cores": $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "unknown"),
              "available_memory_gb": $(free -g 2>/dev/null | awk '/^Mem:/{print $2}' || echo "unknown")
            }
          }
          EOF
          
          # Create human-readable summary
          cat > build-metrics/build-summary-${{ matrix.platform }}.md << EOF
          # Build Performance Report - ${{ matrix.platform }}
          
          **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Version:** ${{ steps.version.outputs.version }}
          **Platform:** ${{ matrix.platform }} (${{ matrix.host }})
          **Runner:** ${{ runner.os }}
          
          ## ⏱️ Build Times
          - Dependencies: ${DEPENDS_BUILD_TIME:-0} seconds
          - Main Build: ${MAIN_BUILD_TIME:-0} seconds  
          - **Total: ${TOTAL_BUILD_TIME:-0} seconds**
          
          ## 💾 Cache Performance
          - Cache Size: ${CACHE_SIZE_MB:-0} MB
          - Cache Hit: $([ "${CACHE_SIZE_MB:-0}" -gt "0" ] && echo "✅ Yes" || echo "❌ No")
          
          ## 🔧 Build Configuration
          - Parallel Jobs: ${MAIN_BUILD_JOBS:-4}
          - Available Cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "unknown")
          - Available Memory: $(free -g 2>/dev/null | awk '/^Mem:/{print $2}' || echo "unknown")GB
          
          ## 📦 Binary Sizes
          - Daemon Binary: ${DAEMON_SIZE_MB:-0} MB
          
          ## 🎯 Performance Score
          $(if [ "${TOTAL_BUILD_TIME:-999}" -lt "600" ]; then echo "🟢 Excellent (<10 min)"; elif [ "${TOTAL_BUILD_TIME:-999}" -lt "1200" ]; then echo "🟡 Good (<20 min)"; else echo "🔴 Needs Optimization (>20 min)"; fi)
          EOF
          
          echo "Build metrics generated for ${{ matrix.platform }}"
        shell: bash

      # ======================================================================
      # 📤 Upload Artifacts
      # ======================================================================
      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}
          path: |
            release/${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}.*
          retention-days: 30

      - name: 📤 Upload Build Verification Results
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ matrix.platform }}
          path: |
            release/build-verification-${{ matrix.platform }}.json
            release/cross-platform-test-${{ matrix.platform }}.json
            release/checksum-verification-${{ matrix.platform }}.json
            release/${{ matrix.artifact_name }}-checksums.json
            release/${{ matrix.artifact_name }}-SHA256SUMS
            release/build-verification-report-${{ matrix.platform }}.md
          retention-days: 90

      - name: 📤 Upload Build Metrics
        uses: actions/upload-artifact@v4
        with:
          name: build-metrics-${{ matrix.platform }}
          path: build-metrics/
          retention-days: 90

  # ============================================================================
  # 🐳 Docker Multi-Platform Build
  # ============================================================================
  docker-build:
    name: 🐳 Docker Multi-Platform
    runs-on: ubuntu-latest
    needs: [build-matrix]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and Push Docker Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            babachain/babachain:latest
            babachain/babachain:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 📋 Create GitHub Release
  # ============================================================================
  create-release:
    name: 📋 Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-matrix, docker-build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏷️ Get Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: 📥 Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 📋 Generate Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # 🚀 BabaChain ${{ steps.version.outputs.version }} - Cross-Platform Release
          
          ## 📦 Platform Support
          
          Bu release aşağıdaki platformları destekler:
          
          ### 🐧 Linux
          - **x86_64**: Ubuntu 20.04+ ve diğer modern Linux dağıtımları
          - **ARM64**: Raspberry Pi 4, AWS Graviton, Apple M1/M2 Linux
          
          ### 🍎 macOS
          - **Intel (x86_64)**: macOS 10.15 Catalina ve üzeri
          - **Apple Silicon (ARM64)**: M1, M2, M3 işlemcili Mac'ler
          
          ### 🪟 Windows
          - **x86_64**: Windows 10/11 (64-bit)
          
          ## 🔧 Kurulum
          
          ### Hızlı Kurulum
          ```bash
          # Linux/macOS
          wget https://github.com/Baba-Chain/BabaChain/releases/download/${{ steps.version.outputs.version }}/babachain-[platform]-${{ steps.version.outputs.version }}.tar.gz
          tar -xzf babachain-[platform]-${{ steps.version.outputs.version }}.tar.gz
          cd babachain-[platform]
          ./babachaind --version
          ```
          
          ### Docker
          ```bash
          docker run -d --name babachain \
            -p 9999:9999 -p 9998:9998 \
            -v babachain-data:/home/babachain/.babachain \
            babachain/babachain:${{ steps.version.outputs.version }}
          ```
          
          ## ✨ Bu Sürümdeki Yenilikler
          
          - ✅ Qt 6 tam uyumluluğu
          - ✅ Cross-platform binary'ler
          - ✅ Geliştirilmiş staking performansı
          - ✅ Otomatik deployment scriptleri
          - ✅ Docker multi-platform desteği
          
          ## 🛡️ Güvenlik
          
          Tüm binary'ler GitHub Actions ile otomatik olarak derlenmiş ve test edilmiştir.
          
          **SHA256 Checksums:**
          ```
          $(find ./artifacts -name "*.tar.gz" -o -name "*.zip" | xargs sha256sum)
          ```
          
          ## 📚 Dokümantasyon
          
          - [Ubuntu Deployment](BABACHAIN_UBUNTU_DEPLOYMENT.md)
          - [macOS Deployment](BABACHAIN_MACOS_DEPLOYMENT.md)  
          - [Windows Deployment](BABACHAIN_WINDOWS_DEPLOYMENT.md)
          - [Cross-Platform Guide](CROSS_PLATFORM_DEPLOYMENT.md)
          
          ## 🆘 Destek
          
          - **GitHub Issues**: https://github.com/Baba-Chain/BabaChain/issues
          - **Discord**: https://discord.gg/babachain
          - **Telegram**: https://t.me/babachainofficial
          EOF

      - name: 📋 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 🚀 BabaChain ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 📊 Build Summary
  # ============================================================================
  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [build-matrix, docker-build, create-release]
    if: always()
    steps:
      - name: 📊 Generate Build Summary
        run: |
          echo "# 🚀 BabaChain Cross-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status | Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux x64 | ${{ needs.build-matrix.result }} | babachain-linux-x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐧 Linux ARM64 | ${{ needs.build-matrix.result }} | babachain-linux-arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS x64 | ${{ needs.build-matrix.result }} | babachain-macos-x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 macOS ARM64 | ${{ needs.build-matrix.result }} | babachain-macos-arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪟 Windows x64 | ${{ needs.build-matrix.result }} | babachain-windows-x64 |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker | ${{ needs.docker-build.result }} | Multi-platform |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Download artifacts from the [Releases page](https://github.com/Baba-Chain/BabaChain/releases)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Test binaries on target platforms" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Deploy to production environments" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Update documentation if needed" >> $GITHUB_STEP_SUMMARY